<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kyros">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161311"/>
      <stop offset="1" stop-color="#221a12"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb454"/>
      <stop offset="1" stop-color="#e08a2c"/>
    </radialGradient>
  </defs>

  <rect width="900" height="220" fill="url(#bg)"/>

  <!-- routing diagram: one hub, four spokes to model nodes -->
  <g transform="translate(120,110)" stroke="#e08a2c" stroke-width="1.4" opacity="0.85">
    <line x1="0" y1="0" x2="0" y2="-62"/>
    <line x1="0" y1="0" x2="54" y2="-31"/>
    <line x1="0" y1="0" x2="54" y2="31"/>
    <line x1="0" y1="0" x2="0" y2="62"/>
  </g>
  <g transform="translate(120,110)">
    <circle r="6" fill="#0" cx="0" cy="-62" style="fill:#7a5636"/>
    <circle r="5" cx="0" cy="-62" fill="#f4c07a"/>
    <circle r="5" cx="54" cy="-31" fill="#f4c07a"/>
    <circle r="5" cx="54" cy="31" fill="#f4c07a"/>
    <circle r="5" cx="0" cy="62" fill="#f4c07a"/>
    <circle r="15" fill="url(#hub)"/>
  </g>

  <text x="230" y="102" font-family="'Segoe UI', system-ui, sans-serif" font-size="54" font-weight="700" fill="#f7ece0" letter-spacing="2">KYROS</text>
  <text x="232" y="134" font-family="'Segoe UI', system-ui, sans-serif" font-size="17" fill="#c99a63" letter-spacing="0.5">the dispatcher that decides which AI model gets the task</text>

  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#8f7a63">
    <text x="232" y="164">cost-aware model selection</text>
    <text x="232" y="184">GPU mutex with crash recovery</text>
    <text x="450" y="164">escalation ladder</text>
    <text x="450" y="184">100% local, no network calls</text>
  </g>
</svg>
